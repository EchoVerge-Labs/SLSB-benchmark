family: er
kind: classification
data_dirs: [er_tamil]  # er_sinhala EXCLUDED -- known dataset-quality issues, see KNOWN_ISSUES.md
languages: [tamil]
primary_metric: accuracy
secondary_metrics: [macro_f1]
head: linear  # WeightedSum + mean-pool + linear (slsb.tasks._common.UtteranceHead)
split: speaker_disjoint_5fold  # data/er_tamil/split_v2.json
notes: >
  Speaker-disjoint 5-fold cross-validation: test = fold k, dev = fold k+1,
  train = the rest; accuracy and macro-F1 are means over folds. Each sentence
  is recorded in most emotions, so sentence overlap doesn't reveal the label.
