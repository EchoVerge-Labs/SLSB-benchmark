family: sd
kind: diarization
data_dirs: [sd_sinhala, sd_tamil]  # SiTa: <name>.wav + <name>.rttm
languages: [sinhala, tamil]
primary_metric: der
secondary_metrics: [missed, false_alarm, confusion]
head: stats_pooling_amsoftmax + AHC  # slsb.tasks.speaker_diarization
split: recording_disjoint  # train / dev / test 40/20/40
notes: >
  Oracle speech regions; the speaker-embedding head trains on the train
  recordings of every language; windows are clustered per recording with a
  cosine-distance threshold tuned on dev (the number of speakers is never
  given). DER with a 0.25 s collar, overlapped speech included.
