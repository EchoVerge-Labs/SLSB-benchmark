family: asv
kind: verification
data_dirs: [asv]
languages: [sinhala, tamil]  # trials_sinhala.csv, trials_tamil.csv inside data/asv/
primary_metric: eer
head: stats_pooling_amsoftmax  # slsb.tasks.speaker_verification; params.yaml asv.head
training_data: asv/train_labels.csv  # SLCeleb dev speakers, none of them in the trials
notes: >
  Trained on speakers disjoint from the trial lists, selected on dev trials from
  held-out training speakers, scored by cosine-similarity EER. The layer mix is
  fixed first from a mean-pool speaker classifier (see README "Protocol").
