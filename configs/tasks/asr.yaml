family: asr
kind: asr
data_dirs: [asr_sinhala, asr_tamil]  # asr_omni_sinhala EXCLUDED (single speaker), see KNOWN_ISSUES.md
languages: [sinhala, tamil]
primary_metric: wer
secondary_metrics: [cer]
head: blstm_ctc  # WeightedSum + 2-layer BiLSTM + CTC (slsb.tasks.asr.BLSTMCTCHead)
split: speaker_disjoint  # train/dev/test
notes: >
  Audio is never cropped (would desync transcript from audio). Every layer's
  frames are extracted once and the head trains on them; selected on dev CER.
