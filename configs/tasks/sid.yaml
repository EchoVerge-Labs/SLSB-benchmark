family: sid
kind: classification
data_dirs: [sid]
languages: [multilingual]
primary_metric: accuracy
secondary_metrics: [macro_f1]
head: linear  # WeightedSum + mean-pool + linear (slsb.tasks._common.UtteranceHead)
notes: >
  Closed set: every speaker is a class, so train/dev/test share speakers by
  definition. Since v0.4 the split is by source video: a speaker's test videos
  are never seen in training, so recording-session cues cannot be used.
