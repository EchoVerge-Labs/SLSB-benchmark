# Summary of the v0.2 protocol. The values the code actually uses live in
# params.yaml; see README.md "Protocol".
evaluation:
  protocol: v0.2
  frozen_upstream: true
  weighted_sum: true          # learned softmax weights over every hidden layer
  model_selection: dev        # lr grid + early stopping on the dev split
  splits: data/<task>/split_v2.json

downstream_head:
  utterance: mean-pool + linear      # sid, er
  asr: 2-layer BiLSTM + CTC          # characters, greedy decoding
  asv: stats pooling + AM-softmax    # cosine scoring
